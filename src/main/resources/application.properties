server.port=8085
spring.application.name=servico-notificacoes

# ========================
# DATABASE
# ========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-notificacoes}:${DB_PORT:5432}/${DB_NAME:notificacoes_db}
spring.datasource.username=${DB_USER:healthsys}
spring.datasource.password=${DB_PASS:healthsys}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========================
# RABBITMQ
# ========================
spring.rabbitmq.host=healthsys-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ========================
# LOGS
# ========================
logging.level.com.healthsys.notificacoes=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n